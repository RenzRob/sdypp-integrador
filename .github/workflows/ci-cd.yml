name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/renzrob

jobs:
  # ── 1. Secret scanning (bloquea todo lo demás) ─────────────────────────────
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

  # ── 2. Build + push de servicios ligeros (Python/Node) ────────────────────
  build-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: gitleaks
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: mining-gateway
            context: backend/mining-gateway
          - service: nct
            context: backend/nct
          - service: auth-service
            context: backend/auth-service
          - service: event-registry
            context: backend/event-registry
          - service: transaction-api
            context: backend/transaction-api
          - service: access-control
            context: backend/access-control
          - service: status-api
            context: backend/status-api
          - service: transaction-pool
            context: backend/transaction-pool
          - service: worker-cpu
            context: backend/worker-cpu
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── 3. Build + push worker-gpu (CUDA 3.9 GB — solo si cambió) ─────────────
  build-push-gpu:
    name: Build & Push — worker-gpu (CUDA)
    runs-on: ubuntu-latest
    needs: gitleaks
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check if worker-gpu changed
        id: changed
        run: |
          git diff --name-only HEAD~1 HEAD | grep -q "^backend/worker-gpu/" && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.changed == 'true'
      - uses: docker/login-action@v3
        if: steps.changed.outputs.changed == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v5
        if: steps.changed.outputs.changed == 'true'
        with:
          context: backend/worker-gpu
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/worker-gpu:latest
          cache-from: type=gha,scope=worker-gpu
          cache-to: type=gha,mode=max,scope=worker-gpu

  # ── 4. Deploy cluster-services → GKE ──────────────────────────────────────
  deploy-services:
    name: Deploy — cluster-services (GKE)
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_SERVICES }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"
      - name: Apply config
        run: kubectl apply -f iac/k8s/cluster-services/config/
      - name: Apply infrastructure
        run: kubectl apply -f iac/k8s/cluster-services/infrastructure/
      - name: Apply services
        run: kubectl apply -f iac/k8s/cluster-services/services/
      - name: Apply network
        run: |
          # ClusterIssuer es cluster-scoped (requiere cluster-admin); ya existe y
          # no cambia en cada deploy. Los ingresses sí se actualizan normalmente.
          kubectl apply -f iac/k8s/cluster-services/network/ingress.yaml
          kubectl apply -f iac/k8s/cluster-services/network/api-ingress.yaml
          kubectl apply -f iac/k8s/cluster-services/network/gateway-ingress.yaml
      - name: Rollout restart (pull new images)
        run: |
          kubectl rollout restart deployment \
            nct auth-service event-registry transaction-api \
            access-control status-api frontend mining-gateway \
            -n g-404
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/nct -n g-404 --timeout=120s
          kubectl rollout status deployment/mining-gateway -n g-404 --timeout=120s

  # ── 5. Deploy cluster-mining → g-404 ──────────────────────────────────────
  deploy-mining:
    name: Deploy — cluster-mining (g-404)
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_MINING }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"
      - name: Apply config
        run: kubectl apply -f iac/k8s/cluster-mining/config/
      - name: Apply infrastructure
        run: kubectl apply -f iac/k8s/cluster-mining/infrastructure/rabbitmq-deployment.yaml
      - name: Apply services
        run: kubectl apply -f iac/k8s/cluster-mining/services/
      - name: Rollout restart (pull new images)
        run: |
          kubectl rollout restart deployment/transaction-pool deployment/worker-cpu -n g-404
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/transaction-pool -n g-404 --timeout=120s
          kubectl rollout status deployment/worker-cpu -n g-404 --timeout=120s
