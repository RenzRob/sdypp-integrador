apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketchain-config
  namespace: g-404
data:
  # RabbitMQ LOCAL del cluster del profe (interno, nunca expuesto)
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
  MINING_DIFFICULTY: "3"
  # TrP → mining-gateway (pull de tareas + post de resultados). URL pública del
  # gateway en GKE (nip.io resuelve a la IP del ingress-nginx, sin registrar dominio).
  GATEWAY_URL: "https://gateway.34.61.108.95.nip.io"
  # Fragmentación del espacio de nonces
  FRAGMENTS: "4"
  NONCE_RANGE: "10000000"
  KEEPALIVE_TIMEOUT: "30"
