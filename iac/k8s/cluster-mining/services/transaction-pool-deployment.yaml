apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-pool
  namespace: g-404
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-pool
  template:
    metadata:
      labels:
        app: transaction-pool
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: transaction-pool
          image: ghcr.io/renzrob/transaction-pool:latest
          # Sin puerto: es un proceso PULL, no recibe conexiones (solo sale).
          envFrom:
            - configMapRef:
                name: ticketchain-config
          volumeMounts:
            - name: tls-cert       # cert+key de cliente (lo presenta al gateway)
              mountPath: /certs
              readOnly: true
            - name: ca-cert        # CA para verificar el cert de server del gateway
              mountPath: /ca
              readOnly: true
      volumes:
        - name: tls-cert
          secret:
            secretName: trp-tls
        - name: ca-cert
          secret:
            secretName: cross-cluster-ca
