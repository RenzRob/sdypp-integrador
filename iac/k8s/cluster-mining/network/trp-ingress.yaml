# Ingress que expone el TrP por HTTPS para que lo alcance el mining-gateway
# del cluster propio. Es el ÚNICO endpoint del cluster del profe expuesto.
#
# Requiere:
#   - Un dominio apuntando al ingress del cluster (reemplazar el host).
#   - Un Secret TLS (cert-manager / Let's Encrypt o cert manual) con el nombre
#     trp-tls. Sin TLS el tráfico entre clusters iría sin cifrar.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transaction-pool-ingress
  namespace: g-404
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # mTLS: exige que el cliente (mining-gateway) presente un cert firmado por nuestra CA
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: "g-404/cross-cluster-ca"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - CAMBIAR-trp.tu-dominio.com
      secretName: trp-tls
  rules:
    - host: CAMBIAR-trp.tu-dominio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transaction-pool
                port:
                  number: 8000
