apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketchain-ingress
  namespace: g-404
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: ticketchain.local
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 5173
