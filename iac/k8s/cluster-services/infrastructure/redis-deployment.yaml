apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: g-404
spec:
  serviceName: redis-master
  replicas: 1
  selector:
    matchLabels:
      app: redis
      role: master
  template:
    metadata:
      labels:
        app: redis
        role: master
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --save
            - "3600"
            - "1"
            - --save
            - "300"
            - "100"
            - --save
            - "60"
            - "10000"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-storage
              mountPath: /data
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc  # reutiliza el PVC existente para no perder datos
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: g-404
spec:
  type: ClusterIP
  selector:
    app: redis
    role: master
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-replica
  namespace: g-404
spec:
  serviceName: redis-replica
  replicas: 1
  selector:
    matchLabels:
      app: redis
      role: replica
  template:
    metadata:
      labels:
        app: redis
        role: replica
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: redis
                  role: master
              topologyKey: kubernetes.io/hostname
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --replicaof
            - redis-master
            - "6379"
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-replica-storage
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-replica-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-replica
  namespace: g-404
spec:
  type: ClusterIP
  selector:
    app: redis
    role: replica
  ports:
    - port: 6379
      targetPort: 6379
---
# Headless Service para que los pods del StatefulSet tengan DNS estable:
# redis-sentinel-0.redis-sentinel, redis-sentinel-1.redis-sentinel, etc.
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: g-404
spec:
  clusterIP: None
  selector:
    app: redis-sentinel
  ports:
    - port: 26379
      targetPort: 26379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: g-404
spec:
  serviceName: redis-sentinel
  replicas: 3
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      labels:
        app: redis-sentinel
    spec:
      containers:
        - name: sentinel
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              echo "sentinel resolve-hostnames yes" > /tmp/sentinel.conf
              echo "sentinel announce-hostnames yes" >> /tmp/sentinel.conf
              echo "sentinel monitor mymaster redis-master 6379 2" >> /tmp/sentinel.conf
              echo "sentinel down-after-milliseconds mymaster 5000" >> /tmp/sentinel.conf
              echo "sentinel failover-timeout mymaster 10000" >> /tmp/sentinel.conf
              echo "sentinel parallel-syncs mymaster 1" >> /tmp/sentinel.conf
              exec redis-sentinel /tmp/sentinel.conf
          ports:
            - containerPort: 26379
