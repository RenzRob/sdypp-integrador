# Emisor de certificados Let's Encrypt (producción) vía challenge HTTP-01,
# resuelto a través del ingress-nginx. cert-manager renueva los certs solo.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: renzomartinrobles99@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
