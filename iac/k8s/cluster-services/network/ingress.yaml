# Ingress público del frontend. TLS confiable emitido y renovado por
# cert-manager (Let's Encrypt). El ruteo /api/* se hace en api-ingress.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketchain-frontend
  namespace: g-404
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ticketchain404.duckdns.org
      secretName: ticketchain-tls
  rules:
    - host: ticketchain404.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 5173
