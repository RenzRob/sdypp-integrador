# Ingress que expone el mining-gateway por HTTPS para recibir el callback de
# resultados del TrP (cluster del profe). Único endpoint del cluster propio
# expuesto hacia el otro cluster.
#
# Requiere dominio + Secret TLS (gateway-tls).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mining-gateway-ingress
  namespace: g-404
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # mTLS: exige que el cliente (transaction-pool) presente un cert firmado por nuestra CA
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: "g-404/cross-cluster-ca"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - CAMBIAR-gateway.tu-dominio.com
      secretName: gateway-tls
  rules:
    - host: CAMBIAR-gateway.tu-dominio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mining-gateway
                port:
                  number: 8000
