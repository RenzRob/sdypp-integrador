apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-api
  namespace: g-404
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-api
  template:
    metadata:
      labels:
        app: transaction-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: transaction-api
          image: ghcr.io/renzrob/transaction-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: ticketchain-config
            - secretRef:
                name: ticketchain-secrets
          resources:
            # "m" = millicores: 1000m = 1 CPU. 100m = 10% de un núcleo (idle), 500m = 50% (límite máximo)
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-api
  namespace: g-404
  labels:
    app: transaction-api
spec:
  type: ClusterIP
  selector:
    app: transaction-api
  ports:
    - name: http
      port: 3003
      targetPort: 3003
