apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: g-404
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/renzrob/frontend:latest
          ports:
            - containerPort: 5173
          envFrom:
            - configMapRef:
                name: ticketchain-config
            - secretRef:
                name: ticketchain-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: g-404
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
