events {
    worker_connections 1024;
}

http {
    client_max_body_size 10m;

    # Docker Compose usa 127.0.0.11, Kubernetes usa el DNS interno del cluster
    # DNS de Docker (este nginx solo se usa en docker-compose local; en k8s el
    # ruteo lo hace el ingress-nginx directo a cada Service)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location /api/auth/ {
            set $upstream auth-service:3001;
            proxy_pass http://$upstream/auth/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        location /api/events/ {
            set $upstream event-registry:3002;
            proxy_pass http://$upstream/events/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        location /api/transactions/ {
            set $upstream transaction-api:3003;
            proxy_pass http://$upstream/transactions/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        location /api/access/ {
            set $upstream access-control:3004;
            proxy_pass http://$upstream/access/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        location /api/status/ {
            set $upstream status-api:3005;
            proxy_pass http://$upstream/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        location /images/ {
            set $upstream minio:9000;
            proxy_pass http://$upstream/ticketchain/;
            proxy_set_header Host minio;
        }

        location / {
            set $upstream frontend:5173;
            proxy_pass http://$upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }
    }
}
