events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # Con variables en proxy_pass, nginx ignora el subpath si hay URI en proxy_pass.
        # Solución: rewrite quita /api/ y deja el path que espera cada servicio,
        # proxy_pass sin URI lo envía tal cual.

        location /api/auth/ {
            set $upstream auth-service:3001;
            rewrite ^/api/auth(/.*)?$ /auth$1 break;
            proxy_pass http://$upstream;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location /api/events/ {
            set $upstream event-registry:3002;
            rewrite ^/api/events(/.*)?$ /events$1 break;
            proxy_pass http://$upstream;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location /api/transactions/ {
            set $upstream transaction-api:3003;
            rewrite ^/api/transactions(/.*)?$ /transactions$1 break;
            proxy_pass http://$upstream;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location /api/access/ {
            set $upstream access-control:3004;
            rewrite ^/api/access(/.*)?$ /access$1 break;
            proxy_pass http://$upstream;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location /api/status/ {
            set $upstream status-api:3005;
            rewrite ^/api/status/(.*)$ /$1 break;
            proxy_pass http://$upstream;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        location /images/ {
            set $upstream minio:9000;
            rewrite ^/images(/.*)?$ /ticketchain$1 break;
            proxy_pass http://$upstream;
            proxy_set_header Host minio;
        }

        # Frontend estático
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
