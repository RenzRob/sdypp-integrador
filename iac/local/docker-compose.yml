version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticketchain
      POSTGRES_PASSWORD: ticketchain
      POSTGRES_DB: ticketchain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticketchain-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketchain"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ticketchain-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ticketchain-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    ports:
      - "15672:15672"

  frontend:
    build:
      context: ../../frontend
    env_file: .env
    ports:
      - "5173:5173"
    networks:
      - ticketchain-net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth-service:
    build:
      context: ../../backend/auth-service
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://ticketchain:ticketchain@postgres:5432/ticketchain
    ports:
      - "3001:3001"
    networks:
      - ticketchain-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  event-registry:
    build:
      context: ../../backend/event-registry
    env_file: .env
    ports:
      - "3002:3002"
    networks:
      - ticketchain-net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  transaction-api:
    build:
      context: ../../backend/transaction-api
    env_file: .env
    ports:
      - "3003:3003"
    networks:
      - ticketchain-net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  access-control:
    build:
      context: ../../backend/access-control
    env_file: .env
    ports:
      - "3004:3004"
    networks:
      - ticketchain-net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  status-api:
    build:
      context: ../../backend/status-api
    env_file: .env
    environment:
      - AUTH_HOST=auth-service
      - EVENTS_HOST=event-registry
      - TRANSACTIONS_HOST=transaction-api
      - ACCESS_HOST=access-control
      - NCT_HOST=nct
    ports:
      - "3005:3005"
    networks:
      - ticketchain-net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nct:
    build:
      context: ../../backend/nct
    env_file: .env
    ports:
      - "8000:8000"
    networks:
      - ticketchain-net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  transaction-pool:
    build:
      context: ../../backend/transaction-pool
    env_file: .env
    networks:
      - ticketchain-net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-cpu:
    build:
      context: ../../backend/worker-cpu
    env_file: .env
    networks:
      - ticketchain-net
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    build:
      context: ../nginx
    ports:
      - "80:80"
    networks:
      - ticketchain-net
    depends_on:
      - frontend
      - auth-service
      - event-registry
      - transaction-api
      - access-control
      - status-api

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - ticketchain-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9001:9001"  # MinIO console

volumes:
  redis_data:
  rabbitmq_data:
  postgres_data:
  minio_data:

networks:
  ticketchain-net:
    driver: bridge
