apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ticketchain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ticketchain/auth-service:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: ticketchain-config
            - secretRef:
                name: ticketchain-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ticketchain
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
