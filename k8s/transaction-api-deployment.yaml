apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-api
  namespace: ticketchain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-api
  template:
    metadata:
      labels:
        app: transaction-api
    spec:
      containers:
        - name: transaction-api
          image: ticketchain/transaction-api:latest
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: ticketchain-config
            - secretRef:
                name: ticketchain-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-api
  namespace: ticketchain
spec:
  type: ClusterIP
  selector:
    app: transaction-api
  ports:
    - port: 3003
      targetPort: 3003
